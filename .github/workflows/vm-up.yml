name: vm-up

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: "VM name"
        default: "orders-demo-vm"
      zone:
        description: "GCE zone"
        default: "us-central1-c"
      machine_type:
        description: "Machine type"
        default: "e2-standard-2"
      host_group:
        description: "OneAgent host group"
        default: "orders-demo-vm"
      repo_ref:
        description: "Branch the VM clones for vm/ files"
        default: "ee-demo"

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GKE_ZONE: ${{ inputs.zone }}
      VM_NAME: ${{ inputs.vm_name }}
      MACHINE_TYPE: ${{ inputs.machine_type }}
      HOST_GROUP: ${{ inputs.host_group }}
      REPO_REF: ${{ inputs.repo_ref }}
      DT_API_URL: ${{ secrets.DT_API_URL }}
      DT_API_TOKEN: ${{ secrets.DT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Provision VM
        run: |
          chmod +x scripts/vm-up.sh
          scripts/vm-up.sh
