# Example 10 — SDv1 over-collapse mirror of example8. Same Nginx workload
# as example5/8, but in an SDv1 namespace with EE on. SDv1 EE for
# WebRequest services without http.route naturally produces GET /* (the
# SDv1 default-name fallback is a built-in code path, not a customizable
# rule like SDv2's). Until 1.341 + the sdv1-url-and-http-route-naming
# heuristic flag flips, this is the over-collapse shape customers see.
apiVersion: v1
kind: ConfigMap
metadata:
  name: example10-shop-nginx
  namespace: example10-sdv1-fallback
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      error_log  /dev/stderr;
      upstream orders {
        server example1-app.example1-empty.svc.cluster.local:8080;
      }
      server {
        listen 8080;
        location ~ ^/shop/products/[^/]+$ {
          rewrite ^.*$ /inventory/check?sku=SKU-1001 break;
          proxy_pass http://orders;
        }
        location ~ ^/shop/carts/[^/]+/items/[^/]+$ {
          rewrite ^.*$ /inventory/check?sku=SKU-1002 break;
          proxy_pass http://orders;
        }
        location ~ ^/shop/orders/[^/]+$ {
          rewrite ^.*$ /orders/search?sku=SKU-1003 break;
          proxy_pass http://orders;
        }
        location = /shop/checkout {
          rewrite ^.*$ /orders/submit break;
          proxy_pass http://orders;
        }
        location = /healthz {
          return 200 'ok\n';
          add_header Content-Type text/plain;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: example10-shop
  namespace: example10-sdv1-fallback
spec:
  selector: { app: example10-shop }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example10-shop
  namespace: example10-sdv1-fallback
spec:
  replicas: 2
  selector:
    matchLabels: { app: example10-shop }
  template:
    metadata:
      labels: { app: example10-shop }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 8080 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: example10-shop }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "128Mi" }
      volumes:
        - name: conf
          configMap: { name: example10-shop-nginx }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-example10
  namespace: example10-sdv1-fallback
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen-example10 }
  template:
    metadata:
      labels: { app: loadgen-example10 }
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          command: ["/bin/sh", "-c"]
          args: ["while true; do k6 run /scripts/loadtest.js; sleep 1; done"]
          env:
            - { name: BASE_URL, value: "http://example10-shop:8080" }
            - { name: DURATION, value: "30m" }
          volumeMounts:
            - { name: script, mountPath: /scripts }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: script
          configMap: { name: loadtest-script-legacy }
