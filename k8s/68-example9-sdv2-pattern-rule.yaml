# Example 9 — SDv2 + URL path pattern matching rule. Same Nginx workload as
# example7, but a builtin:url-path-pattern-matching-rules object scoped to
# this namespace maps the volatile paths to stable templates. That populates
# url.path.pattern on spans, which the endpoint-detection rule
# "[Built-in] HTTP request method and URL path pattern" picks up to produce
# clean endpoint names like "GET /shop/products/{id}" automatically.
# Demonstrates the customer-facing rules approach to fixing over-collapse
# today, parallel to the auto-heuristic that will land later.
apiVersion: v1
kind: ConfigMap
metadata:
  name: example9-shop-nginx
  namespace: example9-sdv2-pattern-rule
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      error_log  /dev/stderr;
      upstream orders {
        server example1-app.example1-empty.svc.cluster.local:8080;
      }
      server {
        listen 8080;
        location ~ ^/shop/products/[^/]+$ {
          rewrite ^.*$ /inventory/check?sku=SKU-1001 break;
          proxy_pass http://orders;
        }
        location ~ ^/shop/carts/[^/]+/items/[^/]+$ {
          rewrite ^.*$ /inventory/check?sku=SKU-1002 break;
          proxy_pass http://orders;
        }
        location ~ ^/shop/orders/[^/]+$ {
          rewrite ^.*$ /orders/search?sku=SKU-1003 break;
          proxy_pass http://orders;
        }
        location = /shop/checkout {
          rewrite ^.*$ /orders/submit break;
          proxy_pass http://orders;
        }
        location = /healthz {
          return 200 'ok\n';
          add_header Content-Type text/plain;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: example9-shop
  namespace: example9-sdv2-pattern-rule
spec:
  selector: { app: example9-shop }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example9-shop
  namespace: example9-sdv2-pattern-rule
spec:
  replicas: 2
  selector:
    matchLabels: { app: example9-shop }
  template:
    metadata:
      labels: { app: example9-shop }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 8080 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: example9-shop }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "128Mi" }
      volumes:
        - name: conf
          configMap: { name: example9-shop-nginx }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-example9
  namespace: example9-sdv2-pattern-rule
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen-example9 }
  template:
    metadata:
      labels: { app: loadgen-example9 }
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          command: ["/bin/sh", "-c"]
          args: ["while true; do k6 run /scripts/loadtest.js; sleep 1; done"]
          env:
            - { name: BASE_URL, value: "http://example9-shop:8080" }
            - { name: DURATION, value: "30m" }
          volumeMounts:
            - { name: script, mountPath: /scripts }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: script
          configMap: { name: loadtest-script-legacy }
