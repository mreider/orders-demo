# Phase 6 — SDv2 baseline. Spring Boot app; same clean Spring routes.
# Uses orders-sdv2's Postgres + Kafka (already SDv2-detected).
# SDv2 endpoint detection is built in; no EE toggle exists for SDv2.
apiVersion: v1
kind: Service
metadata:
  name: example6-app
  namespace: example6-sdv2
spec:
  selector: { app: example6-app }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example6-app
  namespace: example6-sdv2
spec:
  replicas: 1
  selector:
    matchLabels: { app: example6-app }
  template:
    metadata:
      labels: { app: example6-app }
    spec:
      containers:
        - name: example6-app
          image: ghcr.io/mreider/orders-demo:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DB_URL,            value: jdbc:postgresql://postgres.orders-sdv2.svc.cluster.local:5432/orders }
            - { name: DB_USER,           value: orders }
            - { name: DB_PASSWORD,       value: orders }
            - { name: KAFKA_BOOTSTRAP,   value: kafka.orders-sdv2.svc.cluster.local:9092 }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms256m -Xmx512m" }
            - { name: OTEL_SERVICE_NAME, value: example6-app }
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-example6
  namespace: example6-sdv2
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen-example6 }
  template:
    metadata:
      labels: { app: loadgen-example6 }
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          command: ["/bin/sh", "-c"]
          args: ["while true; do k6 run /scripts/loadtest.js; sleep 1; done"]
          env:
            - { name: BASE_URL, value: "http://example6-app:8080" }
            - { name: DURATION, value: "30m" }
          volumeMounts:
            - { name: script, mountPath: /scripts }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: script
          configMap: { name: loadtest-script }
