apiVersion: v1
kind: Namespace
metadata:
  name: orders-sdv1
  labels:
    dynatrace: "enabled"
    orders-demo: "true"
    detection: "sdv1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: orders-sdv2
  labels:
    dynatrace: "enabled"
    orders-demo: "true"
    detection: "sdv2"
---
# Enhanced Endpoints guide - per-example workloads. Each namespace shows a
# different state on the rollout timeline and is configured with its own
# Dynatrace settings (EE on/off, Key Requests, naming rules, SDv2 detection).
#
# orders-sdv1 stays the infra host (Postgres + Kafka) for SDv1 examples.
# orders-sdv2 is the infra host for the SDv2 examples.
apiVersion: v1
kind: Namespace
metadata:
  name: example1-empty
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv1"
    example: "1"
---
apiVersion: v1
kind: Namespace
metadata:
  name: example2-keyreq
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv1"
    example: "2"
---
apiVersion: v1
kind: Namespace
metadata:
  name: example3-ee-on
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv1"
    example: "3"
---
apiVersion: v1
kind: Namespace
metadata:
  name: example4-rule
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv1"
    example: "4"
---
# example4b: like example4 but with an additional custom placeholder rule
# that strips the last URL path segment, handling the short alphanumeric
# IDs that {URL:Path-Clean} does not normalize on its own.
apiVersion: v1
kind: Namespace
metadata:
  name: example4b-custom-placeholder
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv1"
    example: "4b"
---
apiVersion: v1
kind: Namespace
metadata:
  name: example5-overcollapse
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv1"
    example: "5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: example6-sdv2
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv2"
    example: "6"
---
apiVersion: v1
kind: Namespace
metadata:
  name: example7-sdv2-overcollapse
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv2"
    example: "7"
---
# Example 8 — SDv2 with the Fallback endpoint-detection rule deliberately
# enabled per-namespace, producing the textbook GET /* over-collapse shape.
apiVersion: v1
kind: Namespace
metadata:
  name: example8-sdv2-fallback
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv2"
    example: "8"
---
# Example 9 — SDv2 with a URL pattern matching rule that maps volatile paths
# to clean templates. Demonstrates SDv2's customer-facing rule mechanism
# (equivalent to what the heuristic will do automatically once activated).
apiVersion: v1
kind: Namespace
metadata:
  name: example9-sdv2-pattern-rule
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv2"
    example: "9"
---
# Example 10 — SDv1 textbook over-collapse mirror. Same Nginx workload as
# example5, deployed for symmetry with example8 across SDv1/SDv2.
apiVersion: v1
kind: Namespace
metadata:
  name: example10-sdv1-fallback
  labels:
    dynatrace: "enabled"
    ee-demo: "true"
    detection: "sdv1"
    example: "10"
