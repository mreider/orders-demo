# Reverse proxy in front of the orders-demo app.
#
# This is the "web server" generic workload. Nginx terminates HTTP and
# forwards everything to the app. Because Nginx does not emit `http.route`,
# SDv2 endpoint detection on this process flattens all traffic into
# `GET /*` / `POST /*` until you add URL path pattern matching or request
# naming rules - exactly the web-server endpoint story from the docs.
#
# The location blocks below are split per route ONLY so the access log and
# the "View all URLs" surface show the real paths behind the flattened
# endpoint. Nginx still reports them under one method-level endpoint.
worker_processes auto;
events { worker_connections 1024; }

http {
  access_log /var/log/nginx/access.log;

  upstream orders_app {
    server app:8080;
  }

  server {
    listen 80 default_server;

    location /inventory/ {
      proxy_pass http://orders_app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /orders/ {
      proxy_pass http://orders_app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://orders_app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
