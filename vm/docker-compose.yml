# orders-demo on a plain VM (no Kubernetes).
#
# This is the "generic workload" demo for SDv2 PREVIEW. The host runs the
# OneAgent host agent (installed by vm/startup.sh), which deep-monitors every
# container process below. Because there is no Kubernetes, the traces carry
# NO k8s.* resource attributes - only host / process / service attributes.
# That is the whole point: SDv2 for generic workloads must be opted in with a
# matching condition you define (host group / host name), not the built-in
# namespace+cluster condition used for K8s.
#
# Shapes on this host:
#   - nginx  -> a web server (no http.route -> GET /* endpoint flattening)
#   - app    -> a single-service process (Spring Boot, one service/process)
# Both are supported by the generic-workloads Preview. Postgres and Kafka are
# infra dependencies and show up as outbound calls / messaging on the app.
#
# ORDERS_IMAGE is written into .env by vm/startup.sh.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orders", "-d", "orders"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "orders-demo-kraft-cluster-01"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    image: ${ORDERS_IMAGE:-ghcr.io/mreider/orders-demo:latest}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders
      DB_PASSWORD: orders
      KAFKA_BOOTSTRAP: kafka:9092
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      # OTEL_SERVICE_NAME is deliberately UNSET here. We want to first inspect
      # how SDv2 names this single-service process from raw host/process
      # attributes, then design naming. Set it later to control the name.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  k6:
    image: grafana/k6:0.54.0
    volumes:
      - ../load/loadtest.js:/loadtest.js:ro
    environment:
      BASE_URL: "http://nginx:80"
      DURATION: "30m"
    # Traffic enters through nginx so BOTH the web server and the app produce
    # SERVER spans. Loop forever so the demo never goes quiet.
    entrypoint: ["/bin/sh", "-c", "while true; do k6 run /loadtest.js; sleep 1; done"]
    depends_on:
      - nginx
    restart: unless-stopped
